<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMware NSX Practice Quiz</title>
<style>
:root {
  --primary: #4f46e5;
  --accent: #6366f1;
  --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --card-bg: #ffffff;
  --text: #111827;
  --correct: #10b981;
  --incorrect: #ef4444;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1rem;
}
.quiz {
  background: var(--card-bg);
  max-width: 600px;
  width: 100%;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  overflow: hidden;
}
.header, .footer {
  padding: 1rem 2rem;
  text-align: center;
}
.header {
  background: var(--primary);
  color: #fff;
}
.content {
  padding: 2rem;
}
.question {
  font-size: 1.25rem;
  margin-bottom: 1rem;
  color: var(--text);
}
.options {
  list-style: none;
  padding: 0;
  margin: 0;
}
.options li {
  margin-bottom: 0.75rem;
}
label { cursor: pointer; }
input[type=radio], input[type=checkbox] { margin-right: 0.5rem; }
.button {
  display: inline-block;
  padding: 0.75rem 1.5rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;
}
.button:disabled { opacity: 0.6; cursor: not-allowed; }
.result { text-align: left; padding: 2rem; }
.correct { color: var(--correct); }
.incorrect { color: var(--incorrect); }
.progress {
  height: 4px;
  background: #e5e7eb;
}
.progress-bar {
  height: 4px;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease;
}
</style>
</head>
<body>
<div class="quiz">
  <div class="header"><h1>VMware NSX Practice Quiz</h1></div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="content" id="quizContent"></div>
  <div class="footer"><button id="actionBtn" class="button">Start Quiz</button></div>
</div>
<script>
// Helper function to shuffle an array in place
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// Quiz questions array
const questions = [
  { question: "Which NSX component provides the distributed firewall capability at the hypervisor kernel level?", choices: ["NSX Manager", "NSX Edge", "NSX Controller", "NSX Distributed Firewall"], correct: [3], explanation: "The NSX Distributed Firewall runs at the hypervisor kernel level on each ESXi host, providing micro‑segmentation and east‑west traffic inspection directly on the host without hair‑pinning traffic through a centralized appliance." },
  { question: "What is the VMware recommended way to deploy a virtual NSX Edge Node?", choices: ["Through the NSX UI", "Through automated or interactive mode using an ISO", "Through the vSphere Web Client", "Through the OVF command line tool"], correct: [0], explanation: "VMware recommends deploying a virtual NSX Edge Node directly from the NSX Manager UI, which automates configuration and ensures compatibility with NSX policies and services." },
  { question:"Which three selections are capabilities of Network Topology? (Choose three.)", choices:["Display the VMs connected to Segments.","Display the uplink configured on the Tier-0 Gateways.","Display the uplinks configured on the Tier-1 Gateways.","Display how the Physical components are interconnected.","Display how the different NSX components are interconnected."], correct:[0,1,4], explanation:"The Network Topology view shows VMs attached to segments, the uplinks on Tier-0 gateways, and how NSX components interconnect." },
  { question: "An NSX administrator has deployed a single NSX Manager node and will be adding two additional nodes to form a 3-node NSX Management Cluster for a production environment. The administrator will deploy these two additional nodes and Cluster VIP using the NSX UI. What two are the prerequisites for this configuration? (Choose two.)", choices: ["The cluster configuration must be completed using API.", "All nodes must be in the same subnet.", "All nodes must be in separate subnets.", "A compute manager must be configured.", "NSX Manager must reside on a Windows Server."], correct: [1, 3], explanation: "NSX Manager cluster nodes must all reside on the same IP subnet to communicate and form a cluster. Additionally, a compute manager (such as vCenter) must be registered in NSX so that the NSX UI can deploy the additional manager appliances automatically." },
  { question: "Which two commands does an NSX administrator use to check the IP address of the VMkernel port for the Geneve protocol on the ESXi transport node? (Choose two.)", choices: ["net-dvs", "esxcfg-nics -l", "esxcli network ip interface ipv4 get", "esxcfg-vmknic -l", "esxcli network nic list"], correct: [2, 3], explanation: "Use esxcfg-vmknic -l to list all VMkernel interfaces and their IP addresses, and esxcli network ip interface ipv4 get to view detailed IPv4 configuration (including IP address) of a specific VMkernel interface used by Geneve." },
  { question: "Which two are supported by L2 VPN clients? (Choose two.)", choices: ["NSX Autonomous Edge", "NSX Edge", "NSX for vSphere Edge", "3rd party Hardware VPN Device"], correct: [0, 1], explanation: "NSX L2 VPN client functionality is supported on both the NSX Autonomous Edge and NSX Edge appliances; third‑party VPN devices and NSX for vSphere Edge are not supported as L2 VPN clients." },
  { question: "As part of an organization’s IT security compliance requirement, NSX Manager must be configured for 2FA (two-factor authentication). What should an NSX administrator have ready before the integration can be configured?", choices: ["Active Directory LDAP integration with ADFS", "VMware Identity Manager with NSX added as a Web Application", "VMware Identity Manager with an OAuth Client added", "Active Directory LDAP integration with OAuth Client added"], correct: [2], explanation: "Two‑factor authentication for NSX Manager is enabled via VMware Identity Manager using OAuth. Before configuring 2FA, an OAuth client must already be added in VMware Identity Manager to support the integration." },
  { question: "What should an NSX administrator check to verify that VMware Identity Manager integration is successful?", choices: ["From the NSX UI the status of the VMware Identity Manager Integration must be “Enabled”.", "From the NSX CLI the status of the VMware Identity Manager Integration must be “Configured”.", "From VMware Identity Manager the status of the remote access application must be green.", "From the NSX UI the URI in the address bar must have “local=false” part of it."], correct: [0], explanation: "A successful VMware Identity Manager integration is indicated in the NSX Manager UI by the VMware Identity Manager Integration status showing as Enabled, confirming the connection is active and configured correctly." },
  { question:"An administrator has been tasked with implementing the SSL certificates for the NSX Manager Cluster VIP. Which is the correct way to implement this change?", choices:["Send an API call to https://<nsx-mgr>/api/v1/cluster/api-certificate?action=set_cluster_certificate&certificate_id=<certificate_id>","Send an API call to https://<nsx-mgr>/api/v1/node/services/http?action=apply_certificate&certificate_id=<certificate_id>","SSH as admin into the NSX manager with the cluster VIP IP and run nsxcli cluster certificate vip install <certificate_id>","SSH as admin into the NSX manager with the cluster VIP IP and run nsxcli cluster certificate node install <certificate_id>"], correct:[0], explanation:"To implement SSL certificates for the NSX Manager Cluster VIP, the correct method is to send an API call to set the cluster certificate using the endpoint /api/v1/cluster/api-certificate with the action set_cluster_certificate and the specified certificate ID. This ensures that the VIP uses the designated SSL certificate." },
  { question: "An administrator wants to validate the BGP connection status between the Tier‑0 Gateway and the upstream physical router. What sequence of commands could be used to check this status on an NSX Edge node?", choices: ["- enable <LR‑D>\n- get vrf <ID>\n- show bgp neighbor", "- get gateways\n- vrf <VRF‑ID>\n- get bgp neighbor", "- set vrf <ID>\n- show logical-routers\n- show <LR‑D> bgp", "- show logical-routers\n- get vrf\n- show ip route bgp"], correct: [1], explanation: "Using 'get gateways' lists all logical routers and their VRF IDs, 'vrf <VRF‑ID>' switches context into the Tier‑0 VRF, and 'get bgp neighbor' displays the BGP neighbor status—including session state, uptime, and prefixes exchanged." },
  { question: "What is VMware’s recommendation for the minimum MTU requirements when planning an NSX deployment?", choices: ["MTU should be set to 1700 or greater across the data center network including inter-data center connections.", "MTU should be set to 1500 or less only on inter-data center connections.", "Configure Path MTU Discovery and rely on fragmentation.", "MTU should be set to 1550 or less across the data center network including inter-data center connections."], correct: [0], explanation: "VMware recommends configuring a minimum MTU of 1700 (or greater) across the entire data center network—including inter-data center links—to accommodate NSX overlay encapsulation without fragmentation." },
  { question: "In which VPN type are the Virtual Tunnel interfaces (VTI) used?", choices: ["SSL-based VPN", "Route & SSL based VPNs", "Policy & Route based VPNs", "Route-based VPN"], correct: [3], explanation: "VTIs are used in route-based VPNs, where a dedicated virtual interface is established to route traffic, offering greater flexibility and ease of configuration compared to policy-based VPNs." },
  { question:"In an NSX environment, an administrator is observing low throughput and congestion between the Tier-0 Gateway and the upstream physical routers. Which two actions could address low throughput and congestion? (Choose two.)", choices:["Add an additional vNIC to the NSX Edge node.","Configure a Tier-1 gateway and connect it directly to the physical routers.","Configure ECMP on the Tier-0 gateway.","Deploy Large size Edge node/s.","Configure NAT on the Tier-0 gateway."], correct:[2,3], explanation:"Configuring ECMP on the Tier-0 gateway enables multiple parallel paths to upstream routers for load distribution, and deploying large-size Edge nodes provides additional CPU and network bandwidth to handle higher traffic volumes." },
  { question: "What are two valid BGP Attributes that can be used to influence the route path traffic will take? (Choose two.)", choices: ["AS-Path Prepend", "Cost", "BFD", "MED"], correct: [0,3], explanation: "AS-Path Prepend and MED (Multi-Exit Discriminator) are the correct BGP attributes. AS-Path Prepend is used to lengthen the AS path to make a route less preferred, and MED is used to indicate a preference for one exit point over another. The other options are not valid BGP attributes for influencing route selection.", },
  { question: "What are two supported host switch modes? (Choose two.)", choices: ["Overlay Datapath", "DPDK Datapath", "Standard Datapath", "Enhanced Datapath", "Secure Datapath"], correct: [2,3], explanation: "NSX supports two host switch modes: Standard Datapath (the default mode) and Enhanced Datapath, which is designed to improve performance through optimized packet processing on supported hardware.", },
  { question: "Which NSX CLI command is used to change the authentication policy for local users?", choices: ["Set cli-timeout", "Get auth-policy minimum-password-length", "Set hardening-policy", "Set auth-policy"], correct: [3], explanation: "The 'set auth-policy' command is used in NSX to modify the authentication policy for local users, allowing administrators to change parameters such as password complexity and login rules.", },
  { question: "The security administrator turns on logging for a firewall rule. Where is the log stored on an ESXi transport node?", choices: ["/var/log/vmware/nsx/firewall.log", "/var/log/messages.log", "/var/log/dfwpktlogs.log", "/var/log/fw.log"], correct: [2], explanation: "The log is stored in /var/log/dfwpktlogs.log on an ESXi transport node." },
  { question: "Which two statements are true for IPSec VPN? (Choose two.)", choices: ["VPNs can be configured on the command line Interface on the NSX manager.", "IPSec VPN services can be configured at Tier-0 and Tier-1 gateways.", "IPSec VPNs use the DPDK accelerated performance library.", "Dynamic routing Is supported for any IPSec mode In NSX."], correct: [1, 2], explanation: "IPSec VPN services can be configured on both Tier-0 and Tier-1 gateways and leverage the DPDK accelerated performance library, while VPN configuration is not performed through the NSX manager CLI and dynamic routing is not supported for all IPSec modes in NSX." },
  { question: "Which two logical router components span across all transport nodes? (Choose two.)", choices: ["SFRVICE_ROUTER_TJER0", "TIERO_DISTRI BUTE D_ ROUTER", "DISTRIBUTED_R0UTER_TIER1", "DISTRIBUTED_ROUTER_TIER0", "SERVICE_ROUTER_TIERl"], correct: [2, 3], explanation: "The distributed logical router components, DISTRIBUTED_R0UTER_TIER1 and DISTRIBUTED_ROUTER_TIER0, span across all transport nodes, providing the data plane for routing in NSX environments." },
  { question: "Which is an advantage of a L2 VPN In an NSX 4.x environment?", choices: ["Achieve better performance", "Use the same broadcast domain", "Enables VM mobility with re-IP", "Enables Multi-Cloud solutions"], correct: [1], explanation: "L2 VPN in NSX 4.x extends the same broadcast domain across locations, ensuring consistent Layer 2 connectivity which is its primary advantage." },
  { question:"Where in the NSX UI would an administrator set the time attribute for a time-based Gateway Firewall rule?", choices:["There is no option in the NSX UI. It must be done via command line interface.","The option to set time-based rule is a clock icon in the rule.","The option to set time based rule is a field in the rule itself.","The option to set time-based rule is a clock icon in the policy."], correct:[3], explanation:"In the NSX UI, the time attribute for a time-based Gateway Firewall rule is set by clicking the clock icon on the firewall policy, not on the individual rule. This defines the time window during which the policy is active." },
  { question: "Which NSX feature can be leveraged to achieve consistent policy configuration and simplicity across sites?", choices: ["VRF Lite", "Ethernet VPN", "NSX MTML5 UI", "NSX Federation"], correct: [3], explanation: "NSX Federation allows centralized management and policy configuration across multiple sites, providing consistency and simplicity for NSX environments." },
  { question: "How does the Traceflow tool identify issues in a network?", choices: ["Compares the management plane configuration states containing control plane traffic and error reporting from transport node agents.", "Compares intended network state in the control plane with Tunnel End Point (TEP) keepalives in the data plane.", "Injects ICMP traffic into the data plane and observes the results in the control plane.", "Injects synthetic traffic into the data plane and observes the results in the control plane."], correct: [3], explanation: "Traceflow works by injecting synthetic traffic into the data plane and then monitoring how the traffic is processed throughout the network, which allows administrators to pinpoint where issues may be occurring." },
  { question: "Which two statements are correct about East-West Malware Prevention? (Choose two.)", choices: ["A. A SVM is deployed on every ESXi host.", "B. NSX Application Platform must have Internet access.", "C. An agent must be installed on every ESXi host.", "D. An agent must be installed on every NSX Edge node.", "E. NSX Edge nodes must have Internet access."], correct: [0, 1], explanation: "East-West Malware Prevention relies on a Security Virtual Machine (SVM) deployed on every ESXi host to inspect traffic and on the NSX Application Platform, which must have internet access for threat intelligence and malware signature updates. Therefore, A and B are the correct answers. (Reference: NSX Documentation)" },
  { question:"When deploying an NSX Edge Transport Node, what two valid IP address assignment options should be specified for the TEP IP addresses? (Choose two.)", choices:["Use RADIUS","Use BootP","Use a Static IP List","Use an IP Pool","Use a DHCP Server"], correct:[2,3], explanation:"TEP IP addresses can be assigned either from a Static IP List defined in NSX or dynamically from an IP Pool; other methods like RADIUS or BootP are not supported for TEPs." },
  { question: "What can the administrator use to identify overlay segments in an NSX environment if troubleshooting is required?", choices: ["VNI ID", "Segment ID", "Geneve ID", "VIAN ID"], correct: [0], explanation: "For identifying overlay segments during troubleshooting, the VNI (VXLAN Network Identifier) is used. The VNI uniquely marks each overlay segment and is the key parameter when inspecting encapsulation details in NSX environments." },
  { question: "Which command Is used to test management connectivity from a transport node to NSX Manager?", choices: ["esxcli network ip connection list | grep 1234", "esxcli network connection list | grep 1235", "esxcli network ip connection list | grep 1235", "esxcli network connection list | grep 1234"], correct: [0], explanation: "NSX Manager typically communicates with transport nodes using TCP port 1234. The correct method to verify management connectivity is to run the command 'esxcli network ip connection list' and filter for port 1234 using grep." },
  { question: "Which of the following settings must be configured in an NSX environment before enabling stateful active-active SNAT?", choices: ["Tier-1 gateway in active-standby mode", "Tier-1 gateway in distributed only mode", "An Interface Group for the NSX Edge uplinks", "A Punting Traffic Group for the NSX Edge uplinks"], correct: [2], explanation: "Stateful active-active SNAT in NSX 4.x requires defining an Interface Group across the NSX Edge uplinks as the NAT boundary. Other options are not prerequisites for this feature." },
  { question: "Which three NSX Edge components are used for North-South Malware Prevention? (Choose three.)", choices: ["Thin Agent", "RAPID", "Security Hub", "IDS/IPS", "Security Analyzer", "Reputation Service"], correct: [1, 2, 3], explanation: "North‑South Malware Prevention on NSX Edge leverages the IDS/IPS engine for file extraction, the Security Hub to collect events and coordinate verdicts, and RAPID for local file analysis. Thin Agent, Security Analyzer, and Reputation Service are not part of the Edge‑based north‑south prevention stack." },
  { question: "A company security policy requires all users to log into applications using a centralized authentication system. Which two authentication, authorization, and accounting (AAA) systems are available when integrating NSX with VMware Identity Manager? (Choose two.)", choices: ["RADIUS 2.0", "Keygen Enterprise", "RSA SecureID", "LDAP and OpenLDAP based on Active Directory (AD)", "SecureDAP"], correct: [2, 3], explanation: "NSX integration with VMware Identity Manager supports RSA SecureID for token‑based two‑factor authentication and LDAP/OpenLDAP based on Active Directory for directory‑based centralized authentication, providing both methods for AAA integration." },
  { question: "An NSX administrator would like to create an L2 segment with the following requirements: L2 domain should not exist on the physical switches. East/West communication must be maximized as much as possible. Which type of segment must the administrator choose?", choices: ["VLAN", "Overlay", "Bridge", "Hybrid"], correct: [1], explanation: "Overlay segments use Geneve (VXLAN) encapsulation over the NSX transport overlay, eliminating the need for physical VLAN configuration and providing direct host‑to‑host data path for optimized East‑West traffic." },
  { question: "Which VMware GUI tool is used to identify problems in a physical network?", choices: ["VMware Aria Automation", "VMware Aria Orchestrator", "VMware Site Recovery Manager", "VMware Aria Operations Networks"], correct: [3], explanation: "VMware Aria Operations for Networks provides comprehensive network visibility and analytics, enabling administrators to pinpoint and troubleshoot issues in physical network infrastructure." },
  { question: "What are three NSX Manager roles? (Choose three.)", choices: ["master", "cloud", "zookeeper", "manager", "policy", "controller"], correct: [3, 4, 5], explanation: "NSX Manager has three built‑in roles: the Policy role for declarative configuration, the Manager role for validating and storing configurations, and the Controller role for computing the network state. Other options like master, cloud, and zookeeper are not NSX Manager roles." },
  { question: "Which three protocols could an NSX administrator use to transfer log messages to a remote log server? (Choose three.)", choices: ["HTTPS", "TCP", "SSH", "UDP", "TLS", "SSL"], correct: [1, 3, 4], explanation: "NSX nodes can forward syslog messages over UDP, TCP, or encrypted TLS connections to remote log servers; HTTPS, SSH, and SSL are not supported transport protocols for syslog." },
  { question: "Which two BGP configuration parameters can be configured in the VRF Lite gateways? (Choose two.)", choices: ["Graceful Restart", "BGP Neighbors", "Local AS", "Route Distribution", "Route Aggregation"], correct: [1, 4], explanation: "VRF‑Lite gateways allow configuring BGP Neighbors for peering and Route Redistribution under Route Distribution; Local AS is inherited from the parent gateway and cannot be modified, while Graceful Restart and Route Aggregation aren’t supported per VRF." },
  { question: "Which two of the following are used to configure Distributed Firewall on VDS? (Choose two.)", choices: ["vSphere API", "NSX API", "NSX CU", "vCenter API", "NSX UI"], correct: [1, 4], explanation: "Distributed Firewall rules on a vSphere Distributed Switch can be configured programmatically via the NSX REST API and through the NSX Manager user interface (NSX UI)." },
  { question: "Which statement is true about an alarm in a Suppressed state?", choices: ["An alarm can be suppressed for a specific duration in seconds.", "An alarm can be suppressed for a specific duration in days.", "An alarm can be suppressed for a specific duration in minutes.", "An alarm can be suppressed for a specific duration in hours."], correct: [3], explanation: "If you move an alarm into a Suppressed state, you are prompted to specify the duration in hours. After the specified duration passes, the alarm state reverts to Open or Resolved if the condition is corrected." },
  { question: "A customer is preparing to deploy a VMware Kubernetes solution in an NSX environment. What is the minimum MTU size for the UPLINK profile?", choices: ["1500", "1550", "1700", "1650"], correct: [2], explanation: "To support Geneve overlay encapsulation and match NSX’s global default, the uplink profile MTU must be at least 1700 bytes, providing sufficient overhead beyond the 1500-byte inner packet size." },
  { question:"What are two valid options when configuring the scope of a distributed firewall rule? (Choose two.)", choices:["Segment","DFW","Tier-1 Gateway","Segment Port","Group"], correct:[0,4], explanation:"Distributed firewall rules can be scoped to individual Segments or to security Groups that dynamically include objects based on defined criteria." },
  { question: "Which steps are required to activate Malware Prevention on the NSX Application Platform?", choices: ["Select Cloud Region and Deploy Network Detection and Response.", "Activate NSX Network Detection and Response and run Pre-checks.", "Activate NSX Network Detection and Response and Deploy Malware Prevention.", "Select Cloud Region and run Pre-checks."], correct: [3], explanation: "To activate Malware Prevention you must select a Cloud Region in the activation dialog and then run the built-in pre-checks before proceeding with activation. Other options reference NDR or deployment actions not required for Malware Prevention activation." },
  { question: "Which two of the following will be used for Ingress traffic on the Edge node supporting a Single Tier topology? (Choose two.)", choices: ["Inter-Tier interface on the Tier-0 gateway", "Tier-0 Uplink interface", "Downlink Interface for the Tier-0 DR", "Tier-1 SR Router Port", "Downlink Interface for the Tier-1 DR"], correct: [1, 2], explanation: "In a Single-Tier topology, north-south ingress traffic from the physical network arrives on the Tier-0 Service Router uplink interface and, after decapsulation, is forwarded to the segment via the Tier-0 Distributed Router downlink interface." },
  { question: "An NSX administrator wants to create a Tier-0 Gateway to support equal cost multi-path (ECMP) routing. Which failover detection protocol must be used to meet this requirement?", choices: ["Bidirectional Forwarding Detection (BFD)", "Virtual Router Redundancy Protocol (VRRP)", "Beacon Probing (BP)", "Host Standby Router Protocol (HSRP)"], correct: [0], explanation: "NSX Tier-0 Gateways require BFD for ECMP routing because BFD provides rapid forwarding-path failure detection across multiple equal-cost paths, enabling efficient load balancing and failover." },
  { question: "An administrator has a requirement to have consistent policy configuration and enforcement across NSX instances. What feature of NSX fulfills this requirement?", choices: ["Load balancer", "Federation", "Multi-hypervisor support", "Policy-driven configuration"], correct: [1], explanation: "NSX Federation provides a Global Manager that centrally defines and distributes network and security policies to Local Managers, ensuring consistent configuration and enforcement across multiple NSX instances." },
  { question: "Where does an administrator configure the VLANs used in VRF Lite? (Choose two.)", choices: ["Segment connected to the Tier-1 gateway", "Uplink trunk segment", "Downlink interface of the default Tier-0 gateway", "Uplink interface of the VRF gateway", "Uplink interface of the default Tier-0 gateway"], correct: [1, 3], explanation: "In VRF-Lite you first define VLAN trunk segments (specifying allowed VLAN ranges) when creating segments, and then set the Access (VLAN) on each VRF gateway uplink interface to map traffic to those VLANs." },
  { question: "An architect receives a request to apply distributed firewall in a customer environment without making changes to the network and vSphere environment. Which two of the following requirements must be met in the environment? (Choose two.)", choices: ["vCenter 8.0 and later", "NSX version must be 3.2 and later", "NSX version must be 3.0 and later", "VDS version 6.6.0 and later"], correct: [1, 3], explanation: "NSX Distributed Firewall support on native vSphere Distributed Switches was introduced in NSX 3.2, and it requires a VDS of version 6.6.0 or later to enable firewall capabilities directly on VDS port groups without needing NSX segments." },
  { question: "When a stateful service is enabled for the first time on a Tier-0 Gateway, what happens on the NSX Edge node?", choices: ["SR is instantiated and automatically connected with DR.", "DR is instantiated and automatically connected with SR.", "SR and DR is instantiated but requires manual connection.", "SR and DR doesn't need to be connected to provide any stateful services."], correct: [0], explanation: "Upon enabling a stateful service, NSX automatically instantiates a Service Router (SR) on the Edge node and creates the internal transit link to the existing Distributed Router (DR) without manual intervention." },
  { question: "Which three data collection sources are used by NSX Network Detection and Response to create correlations/Intrusion campaigns? (Choose three.)", choices: ["Files and anti-malware file events from the NSX Edge nodes and the Security Analyzer", "East-West anti-malware events from the ESXi hosts", "Distributed Firewall flow data from the ESXi hosts", "IDS/IPS events from the ESXi hosts and NSX Edge nodes", "Suspicious Traffic Detection events from NSX Intelligence"], correct: [0, 3, 4], explanation: "NSX Network Detection and Response’s correlation engine aggregates file events from Edge + Security Analyzer, IDS/IPS events from hosts + Edge nodes, and Suspicious Traffic Detection events from NSX Intelligence to build intrusion campaigns." },
  { question: "Which two CLI commands could be used to see if vmnic link status is down? (Choose two.)", choices: ["esxcfg-nics -1", "excli network nic list", "esxcli network vswitch dvs wmare list", "esxcfg-vmknic -1", "esxcfg-vmsvc/get.network"], correct: [0, 1], explanation: "Both `esxcfg-nics -l` and `esxcli network nic list` display physical NICs and their link statuses, allowing an administrator to verify if any vmnic is down. :contentReference[oaicite:0]{index=0}" },
  { question: "Which Traceflow traffic type should an NSX administrator use for validating connectivity between App and DB virtual machines that reside on different segments?", choices: ["Anycast", "Multicast", "Broadcast", "Unicast"], correct: [3], explanation: "Unicast Traceflow sends a point-to-point packet from the App VM to the DB VM, allowing direct validation of connectivity between two endpoints on different segments." },
  { question: "Which two of the following parameters are required for deploying the NSX Application Platform? (Choose two.)", choices: ["Interface Name", "Upload XML File", "Cluster Format Type", "Interface Service Name", "Upload Kubernetes Configuration File"], correct: [3, 4], explanation: "When deploying the NSX Application Platform you must provide an Interface Service Name (FQDN for the HTTPS endpoint) and upload the Kubernetes configuration file (kubeconfig) for the target cluster. These are mandatory deployment parameters." },
  { question: "Which CLI command would an administrator use to allow syslog on an ESXi transport node when using the esxcli utility?", choices: ["esxcli network firewall ruleset set -a -e false", "esxcli network firewall ruleset set -r syslog -e false", "esxcli network firewall ruleset -e syslog", "esxcli network firewall ruleset set -r syslog -e true"], correct: [3], explanation: "To enable the syslog firewall ruleset you use the esxcli network firewall ruleset set command with the ruleset-id=syslog and enabled=true options, which corresponds to set -r syslog -e true.", citations: ["turn0search0","turn0search2"] },
  { question: "An administrator has deployed 10 Edge Transport Nodes in their NSX Environment, but has forgotten to specify an NTP server during the deployment. What is the efficient way to add an NTP server to all 10 Edge Transport Nodes?", choices: ["Use a Node Profile", "Use Transport Node Profile", "Use the CLI on each Edge Node", "Use a PowerCLI script"], correct: [0], explanation: "Transport Node Profiles allow you to centrally configure settings such as NTP servers and apply them across all Edge Transport Nodes in one operation via System > Fabric > Profiles > Transport Node Profiles." },
  { question: "An NSX administrator would like to export syslog events that capture messages related to NSX host preparation events. Which message ID (msgid) should be used in the syslog export configuration command as a filter?", choices: ["FABRIC", "SYSTEM", "GROUPING", "MONITORING"], correct: [0], explanation: "The FABRIC msgid captures host preparation and other fabric-related events, making it the appropriate filter for NSX host preparation syslog exports." },
  { question: "What are two functions of the Service Engines in NSX Advanced Load Balancer? (Choose two.)", choices: ["It collects real-time analytics from application traffic flows.", "It stores the configuration and policies related to load-balancing services.", "It performs application load-balancing operations.", "It deploys web servers to perform load-balancing operations.", "It provides a user interface to perform configuration and management tasks."], correct: [0, 2], explanation: "Service Engines are the data-plane components that perform application load-balancing and collect real-time analytics from application traffic flows. Configuration storage is handled by the Controller, and the user interface is provided by the Admin Console." },
  { question: "Which CLI command does an NSX administrator run on the NSX Manager to generate support bundle logs if the NSX UI is inaccessible?", choices: ["esxcli system syslog config logger set --id=nsxmanager", "get support-bundle file vcpnv.tgz", "vm-support", "set support-bundle file vcpnv.tgz"], correct: [1], explanation: "When the NSX UI is unavailable, you can SSH into the NSX Manager and run `get support-bundle file <filename>` to generate the support bundle. For example: `get support-bundle file vcpnv.tgz`." },
  { question: "Which table on an ESXi host is used to determine the location of a particular workload for a frame-forwarding decision?", choices: ["Routing Table", "ARP Table", "TEP Table", "MAC Table"], correct: [3], explanation: "The MAC Table on an ESXi host maps workload MAC addresses to their corresponding TEP IPs, allowing the host to determine where a specific VM resides for frame-forwarding decisions." },
  { question: "When collecting support bundles through NSX Manager, which files should be excluded for potentially containing sensitive information?", choices: ["Controller Files", "Management Files", "Core Files", "Audit File"], correct: [2], explanation: "Core files may include memory dumps containing sensitive information—such as passwords or encryption keys—and should be excluded from support bundles unless explicitly required." },
  { question: "Which choice is a valid insertion point for North-South network introspection?", choices: ["Tier-0 gateway", "Host Physical NIC", "Guest VM vNIC", "Partner SVM"], correct: [0], explanation: "North-South network introspection in NSX is inserted at the Tier-0 gateway, where traffic enters and exits the overlay, allowing inspection of ingress and egress flows." },
  { question: "An NSX administrator is troubleshooting a connectivity issue with virtual machines running on an ESXi transport node. Which feature in the NSX UI shows the mapping between the virtual NIC and the host’s physical adapter?", choices: ["Port Mirroring", "IPFIX", "Activity Monitoring", "Switch Visualization"], correct: [3], explanation: "Switch Visualization in the NSX UI graphically displays the relationship between VM vNICs and the host’s physical network adapters, aiding in troubleshooting overlay-to-underlay mappings." },
  { question:"Which two statements describe the characteristics of an Edge Cluster in NSX? (Choose two.)","choices":["Can have a maximum of 10 edge nodes","Can have a maximum of 8 edge nodes","Can contain multiple types of edge nodes (VM or bare metal)","Must contain only one type of edge nodes (VM or bare metal)","Must have only active-active edge nodes"], correct:[0,2], explanation:"An NSX Edge Cluster supports up to 10 Edge nodes, and it cannot mix VM-based and bare-metal Edge nodes. All nodes in the cluster must use the same form factor." },
  { question:"When running nsxcli on an ESXi host, which command will show the Replication mode?",choices:["get logical-switch status","get logical-switch UUID status","get logical-switches","get logical-switch"],correct:[0],explanation:"The get logical-switch status command displays detailed status information for logical switches, including the configured replication mode for BUM traffic." },
  { question:"An administrator needs to download the support bundle for NSX Manager. Where does the administrator download the log bundle from?",choices:["System > Utilities > Tools","System > Settings > Support Bundle","System > Support Bundle","System > Settings"],correct:[2],explanation:"The System > Support Bundle section in the NSX Manager UI provides the option to download the log bundle directly." },
  { question:"Which two steps must an NSX administrator take to integrate VMware Identity Manager in NSX to support role-based access control? (Choose two.)",choices:["Enter the Identity Provider (IdP) metadata URL in NSX Manager.","Create an OAuth 2.0 client in VMware Identity Manager.","Create a SAML authentication in VMware Identity Manager using the NSX Manager FQDN.","Add NSX Manager as a Service Provider (SP) in VMware Identity Manager.","Enter the service URL, Client Secret, and SSL thumbprint in NSX Manager."],correct:[1,4],explanation:"For OAuth2 integration, you create an OAuth 2.0 client in vIDM and then enter the service URL, Client Secret, and SSL thumbprint into NSX Manager to establish the trust." },
  { question:"Which two choices are use cases for Distributed Intrusion Detection? (Choose two.)", choices:["Identify risk and reputation of accessed websites.","Use agentless antivirus with Guest Introspection.","Quarantine workloads based on vulnerabilities.","Gain Insight about micro-segmentation traffic flows.","Identify security vulnerabilities in the workloads."], correct:[2,4], explanation:"Distributed Intrusion Detection is used to identify security vulnerabilities in workloads and to quarantine them based on detected vulnerabilities. It provides deep packet inspection and threat detection within the data center." },
  { question:"Which three of the following describe the Border Gateway Routing Protocol (BGP) configuration on a Tier-0 Gateway? (Choose three.)",choices:["It supports a 4-byte autonomous system number","The network is divided into areas that are logical groups","Can be used as an Exterior Gateway Protocol","BGP is enabled by default","EIGRP is disabled by default"],correct:[0,2,4],explanation:"Tier-0 Gateways support BGP as an Exterior Gateway Protocol with 4-byte AS numbers, and EIGRP is disabled by default." },
  { question:"Which two statements are true about IDS Signatures? (Choose two.)", choices:["Users can upload their own IDS signature definitions.","An IDS signature contains data used to identify the creator of known exploits and vulnerabilities.","IDS signatures can be High Risk, Suspicious, Low Risk and Trustworthy.","An IDS signature contains data used to identify known exploits and vulnerabilities.","An IDS signature contains a set of instructions that determine which traffic is analyzed."], correct:[0,3], explanation:"Users can upload custom IDS signature definitions, and each signature contains specific patterns used to identify known exploits and vulnerabilities." },
  { question:"An NSX administrator is creating a Tier-1 Gateway configured in Active-Standby High Availability Mode. In the event of node failure, the failover policy should not allow the original failed node to become the Active node upon recovery. Which failover policy meets this requirement?",choices:["Enable Preemptive","Non-Preemptive","Preemptive","Disable Preemptive"],correct:[1],explanation:"Non-Preemptive mode prevents the original preferred node from failing back to active upon recovery, ensuring the standby remains active until manually changed." },
  { question:"Which three DHCP Services are supported by NSX? (Choose three.)",choices:["Port DHCP per VNF","Segment DHCP","Gateway DHCP","VRF DHCP Server","DHCP Relay"],correct:[1,2,4],explanation:"NSX-T supports Segment DHCP, Gateway DHCP on the Tier-1 Gateway loopback, and DHCP Relay to forward requests to external DHCP servers." },
  { question:"Which two commands must be executed to check BGP neighbor status? (Choose two.)", choices:["vrf 3","sa-nsxedge-01(tier1_sr)> get bgp neighbor","vrf 4","sa-nsxedge-01(tier0_dr)> get bgp neighbor","vrf 1","sa-nsxedge-01(tier0_sr)> get bgp neighbor"], correct:[4,5], explanation:"Enter the Tier-0 service router VRF context with `vrf 1` and then run `get bgp neighbor` in tier0_sr mode to display the BGP neighbor status." },
  { question:"Which two built-in VMware tools will help identify the cause of packet loss on VLAN Segments? (Choose two.)", choices:["Packet Capture","Live Flow","Traceflow","Flow Monitoring","Activity monitoring"], correct:[0,2], explanation:"Packet Capture captures actual traffic for analysis, and Traceflow simulates and tracks packet paths through the network to pinpoint where loss occurs." },
  { question:"An NSX administrator is creating a NAT rule on a Tier-0 Gateway configured in active-standby high availability mode. Which two NAT rule types are supported for this configuration? (Choose two.)", choices:["Destination NAT","Reflexive NAT","Port NAT","Source NAT","1:1 NAT"], correct:[0,3], explanation:"Active-Standby Tier-0 Gateways support stateful Source NAT (SNAT) for outbound traffic and Destination NAT (DNAT) for inbound traffic only; Reflexive and 1:1 mappings are configured via separate SNAT/DNAT rules rather than standalone types. " },
  { question:"Which of the following exist only on Tier-1 Gateway firewall configurations and not on Tier-0?",choices:["Applied To","Actions","Sources","Profiles"],correct:[3],explanation:"Gateway firewall rules on Tier-1 support attaching context profiles (e.g., L7 access or flood protection profiles), a feature not available on Tier-0 firewall configurations." },
  { question:"Which three security features are dependent on the NSX Application Platform? (Choose three.)",choices:["NSX Malware Prevention","NSX Intelligence","NSX Distributed IDS/IPS","NSX Network Detection and Response","NSX TLS Inspection","NSX Firewall"],correct:[0,1,3],explanation:"NSX Malware Prevention, NSX Intelligence, and NSX Network Detection and Response are hosted on and depend upon the NSX Application Platform for scalable data ingestion, analytics, and threat prevention services." },
  { question:"Which two are requirements for FQDN Analysis? (Choose two.)", choices:["A layer 7 gateway firewall rule must be configured on the Tier-0 gateway uplink.","The NSX Manager requires access to the Internet to download category and reputation definitions.","The NSX Edge nodes require access to the Internet to download category and reputation definitions.","A layer 7 gateway firewall rule must be configured on the Tier-1 gateway uplink.","ESXi control panel requires access to the Internet to download category and reputation definitions."], correct:[2,3], explanation:"FQDN Analysis requires a Layer 7 gateway firewall rule on the Tier-1 gateway uplink to capture DNS traffic for domain resolution, and NSX Edge nodes must have Internet access to download category and reputation definitions." },
  { question:"What needs to be configured on a Tier-0 Gateway to make NSX Edge Services available to a VM on a VLAN-backed logical switch?", choices:["VLAN Uplink","Loopback Router Port","Downlink Interface","Service Interface"], correct:[3], explanation:"A Service Interface on the Tier-0 Gateway connects the VLAN-backed segment directly to the Edge services, enabling NSX Edge functions for VMs on that segment." },
  { question:"Where can an administrator see a visual overview of network connections between different VMs and different networks, within the NSX domain?", choices:["VMware Aria Operations","NSX Intelligence","Network Intelligence","VMware Aria Operations for Networks"], correct:[1], explanation:"Administrators can view an interactive topology and traffic-flow visualization under NSX Intelligence in the NSX Manager UI." },
  { question:"Which CLI command disables the nsxcli time out value on NSX Manager?", choices:["set cli-timeout 1","set cli-timeout enabled","set cli-timeout 0","set cli-timeout disabled"], correct:[2], explanation:"Setting the timeout to 0 disables the nsxcli idle timeout on NSX Manager." },
  { question:"Where is the insertion point for East-West network introspection?", choices:["Tier-0 router","Host Physical NIC","Guest VM vNIC","Partner SVM"], correct:[2], explanation:"East-West network introspection occurs at the Guest VM vNIC, where the distributed firewall enforces micro-segmentation policies and can redirect traffic to partner SVMs for advanced inspection." },
  { question:"When configuring OSPF on a Tier-0 Gateway, which three of the following must match in order to establish a neighbor relationship with an upstream router? (Choose three.)", choices:["MTU of the Uplink","Subnet mask","Address of the neighbor","Protocol and Port","Naming convention","Area ID"], correct:[0,1,5], explanation:"OSPF neighbors require matching MTU on the link, identical subnet masks to reside on the same network, and the same Area ID to form adjacency." },
  { question:"A customer is planning to utilize NSX-T Data Center security services while maintaining current security services providers. Which two features can help the customer achieve this kind of integration? (Choose two.)", choices:["Network Introspection","Guest Introspection","Gateway Firewall","Intrusion Detection","Distributed Firewall"], correct:[0,1], explanation:"Network Introspection and Guest Introspection enable integration with third-party security services by redirecting traffic or offloading inspection to existing provider appliances without replacing them." },
  { question:"What does a customer need to configure to create GENEVE backed segments using NSX-T Data Center?", choices:["Overlay Transport Zone","VLAN Transport Zone","Virtual Standard Switch","Virtual Distributed Switch"], correct:[0], explanation:"GENEVE-backed segments require an Overlay Transport Zone to provide the encapsulation transport across NSX-T overlay networks." },
  { question:"An NSX administrator is using ping to check connectivity between VM1 running on ESXi1 to VM2 running on ESXi2. The ping test fails. The administrator knows the maximum transmission unit size on the physical switch is 1600. Which command does the administrator use to check the VMware kernel ports for tunnel end point communication?", choices:["esxcli network diag ping -H <destination IP address>","esxcli network diag ping -I vmk0O -H <destination IP address>","vmkping ++netstack=geneve -d -s 1572 <destination IP address>","vmkping ++netstack=vxlan -d -s 1572 <destination IP address>"], correct:[2], explanation:"The vmkping command with ++netstack=geneve targets the Geneve tunnel endpoint on the host and uses -d -s 1572 to test the maximum non-fragmented packet size over the overlay tunnel." },
  { question:"An administrator has connected two virtual machines on the same overlay segment. Ping between both virtual machines is successful. What type of network boundary does this represent?", choices:["Layer 2 bridge","Layer 2 broadcast domain","Layer 2 VPN","Layer 3 route"], correct:[1], explanation:"An overlay segment acts as a Layer 2 broadcast domain, enabling VMs on the same segment to communicate at Layer 2." },
  { question:"A security administrator needs to configure a firewall rule based on the domain name of a specific application. Which field in a distributed firewall rule does the administrator configure?", choices:["Source","Service","Profile","Policy"], correct:[2], explanation:"The Profile field is used to match application-level attributes such as domain names for firewall rules." },
  { question:"A company is deploying NSX micro-segmentation in their vSphere environment to secure a simple application composed of web, app, and database tiers. The naming convention will be: WKS-WEB-SRV-XXX, WKY-APP-SRR-XXX, WKI-DB-SRR-XXX. What is the optimal way to group them to enforce security policies from NSX?", choices:["Use Edge as a firewall between tiers","Group all by means of tags membership","Create an Ethernet based security policy","Do a service insertion to accomplish the task"], correct:[1], explanation:"Grouping VMs using tag-based membership allows dynamic and scalable policy enforcement in NSX. It enables automatic inclusion in security groups and appropriate firewall rules without manual intervention, aligning with NSX micro-segmentation best practices." },
  { question:"What are four NSX built-in role-based access control (RBAC) roles? (Choose four.)", choices:["LB Operator","Enterprise Admin","None","Auditor","Full Access","Network Admin"], correct:[0,1,3,5], explanation:"NSX includes built-in RBAC roles such as LB Operator, Enterprise Admin, Auditor, and Network Admin to delegate permissions. 'None' is not a valid role, and 'Full Access' is not an official NSX role name." },
  { question:"Which CLI command is used for packet capture on the ESXi Node?", choices:["debug","tcpdump","set capture","pktcap-uw"], correct:[3], explanation:"The 'pktcap-uw' command is the native CLI tool on ESXi hosts for performing packet captures at various points in the network stack, offering deep visibility into traffic flows." },
  { question:"Which CLI command does a NSX administrator use to obtain information about the NSX Manager configuration when troubleshooting a production system?", choices:["show configuration","get managers","show interface","get configuration"], correct:[1], explanation:"According to the NSX 4.x Administration Guide and the 2V0-41.24 Exam Blueprint, the 'get managers' command is specifically used to retrieve NSX Manager cluster configuration and status, making it valuable for troubleshooting." },
  { question:"Which three networking features could be configured using the NSX Manager Simplified UI? (Choose three.)", choices:["NAT Rules","containers","load balancers","logical routers","segments","logical switches"], correct:[0,2,4], explanation:"Using the NSX Manager Simplified UI, administrators can configure key networking features like NAT rules, load balancers, and segments. Logical routers and switches are handled under newer constructs, and 'containers' is not a directly configurable networking feature in this context." },
  { question:"A security administrator has configured a gateway firewall rule to block traffic to all Web servers. What can the administrator infer about the rule publication after reviewing the log extract?", choices:["The user has no permission to create gateway firewall rules.","The rule has been successfully realized in the NSX Manager.","The rule has been successfully realized in the data path.","There was a communication problem with the Central Control Plane."], correct:[1], explanation:"The log shows that the rule was processed by the RuleFactoryService and successfully propagated with an 'overallStatus=SUCCESS' from the RealizationStateService. This confirms the rule was realized in the NSX Manager's management plane. However, no evidence in the log confirms data path realization, which requires additional checks." },
  { question:"A centralized packet analysis tool VM configured to monitor a NSX-T deployment is dropping some of the packets sent to it. Which three actions could minimize the drops? (Choose three.)", choices:["Increase the RX buffer ring size.","Assign more CPU resources to the VM.","Use DPDK to improve packet processing performance.","Ensure the host 10GbE NIC is configured for full duplex.","Increase the TX buffer ring size.","Increase MTU on the VM to 9000."], correct:[0,1,2], explanation:"To minimize packet drops in a monitoring VM, increasing the RX buffer ring size can help absorb bursts of incoming traffic, assigning more CPU resources ensures adequate processing power, and using DPDK significantly improves packet processing efficiency. Full duplex and TX buffer size are not primary contributors to receive-side drops in this context, and increasing MTU won't reduce packet loss without addressing processing limitations." },
  { question:"Which command is used to set the NSX Manager's logging-level to debug mode for troubleshooting?", choices:["set service manager log-level debug","set service nsx-manager logging-level debug","set service manager logging-level debug","set service nsx-manager log-level debug"], correct:[2], explanation:"The correct command is 'set service manager logging-level debug'. This adjusts the logging level for the NSX Manager service, enabling detailed debug output helpful for troubleshooting." },
  { question:"Which two tools could be used to view NSX Policy logs? (Choose two.)", choices:["NSX Manager CLI","NSX Manager root privileged mode","ESXI host nsxcli","KVM host nsxcli","Edge CLI"], correct:[0,4], explanation:"NSX Policy logs can be accessed via the NSX Manager CLI, which provides visibility into policy configuration and enforcement logs using commands like 'get log-file'. Additionally, the Edge CLI offers logs related to policy enforcement on Edge nodes, such as firewall activity, which is part of NSX Policy enforcement." },
  { question:"Which discovery protocol is supported for hypervisor transport nodes?", choices:["Link Layer Discovery Protocol","Cisco Discovery Protocol","Neighbor Discovery Protocol","Adobe Real-time CDP"], correct:[0], explanation:"NSX supports Link Layer Discovery Protocol (LLDP) for hypervisor transport nodes to advertise and discover physical network connectivity. CDP is not supported, and the other options are invalid in this context." },
  { question:"Which two VMware Cloud Management systems are compatible with NSX-T Data Center capabilities? (Choose two.)", choices:["VMware Power CLI","vRealize Automation","vRealize CodeStream","VMware Integrated OpenStack","VMware vSphere"], correct:[1,3], explanation:"vRealize Automation and VMware Integrated OpenStack are cloud management systems that integrate with NSX-T Data Center to deliver networking and security capabilities within automated and cloud-native environments. PowerCLI is a scripting tool, CodeStream is for CI/CD, and vSphere is a hypervisor platform, not a cloud management system." },
  { question:"Which command is used to display the network configuration of the Tunnel Endpoint (TEP) IP on a bare metal transport node?", choices:["tepconfig","tcpdump","debug","ifconfig"], correct:[3], explanation:"The 'ifconfig' command is used on bare metal transport nodes to display network configurations, including the TEP IP. NSX does not provide a specific 'tepconfig' command for this purpose, and 'tcpdump' or 'debug' are used for other diagnostic tasks." },
  { question:"Which troubleshooting step will resolve an error with code 1001 during the configuration of a time-based firewall rule?", choices:["Reinstalling the NSX VIBs on the ESXi host.","Reconfiguring the ESXi host with a local NTP server.","Restarting the NTP service on the ESXi host.","Changing the time zone on the ESXi host."], correct:[2], explanation:"Error code 1001 typically indicates a time synchronization issue that affects time-based firewall rules. Restarting the NTP service on the ESXi host can restore proper time sync, which is essential for the rule to function correctly." },
  { question:"Which is the only supported mode in NSX Global Manager when using Federation?", choices:["Proton","Proxy","Controller","Policy"], correct:[3], explanation:"The only supported mode in NSX Global Manager when using Federation is 'Policy' mode. This mode ensures consistent security and networking policies across multiple NSX-T instances in a federated setup." },
  { question:"What must be configured on Transport Nodes for encapsulation and decapsulation of Geneve protocol?", choices:["STT","VXIAN","UDP","TEP"], correct:[3], explanation:"Tunnel Endpoints (TEPs) must be configured on Transport Nodes to perform encapsulation and decapsulation of Geneve protocol traffic. TEPs enable NSX to transport overlay traffic across the physical network." },
  { question:"Which CLI command on NSX Manager and NSX Edge is used to change NTP settings?", choices:["get timezone","get time-server","set ntp-server","set timezone"], correct:[2], explanation:"The 'set ntp-server' command is used on both NSX Manager and NSX Edge CLI to configure or change the NTP server settings, ensuring time synchronization for proper system and security operations." },
  { question:"What are the four types of role-based access control (RBAC) permissions? (Choose four.)", choices:["Full access","Execute","None","Read","Enterprise Admin","Auditor"], correct:[0,1,2,3], explanation:"The four RBAC permission types are Full access, Execute, None, and Read. These define the level of interaction a user can have with NSX objects. 'Enterprise Admin' and 'Auditor' are roles, not permission types." },
  { question:"How is the RouterLink port created between a Tier-1 Gateway and Tier-0 Gateway?", choices:["Manually create a Logical Switch and connect to both Tier-1 and Tier-0 Gateways.","Automatically created when Tier-1 is created.","Automatically created when Tier-1 is connected with Tier-0 from NSX UI.","Manually create a Segment and connect to both Tier-1 and Tier-0 Gateways."], correct:[2], explanation:"The RouterLink port is automatically created when a Tier-1 Gateway is connected to a Tier-0 Gateway using the NSX UI. This internal link facilitates routing between the two gateways without manual network segment configuration." },
  { question:"Which command on ESXi is used to verify the Local Control Plane connectivity with Central Control Plane?", choices:["esxcli network ip connection list | grep netcpa","esxcli network ip connection list | grep 1234","esxcli network ip connection list | grep 1235","esxcli network ip connection list | grep ccpd"], correct:[2], explanation:"Port 1235 is used for communication between the Local Control Plane (LCP) on the ESXi host and the Central Control Plane (CCP). The command 'esxcli network ip connection list | grep 1235' verifies that this connection is active." },
  { question:"An NSX administrator is reviewing syslog and notices that Distributed Firewall Rules hit counts are not being logged. What could cause this issue?", choices:["Distributed Firewall Rule logging is not enabled.","Zero Trust Security is not enabled.","Syslog is not configured on the NSX Manager.","Syslog is not configured on the ESXi transport node."], correct:[0], explanation:"If Distributed Firewall Rule logging is not enabled, hit counts and rule logging will not be sent to syslog. Each rule must have logging explicitly turned on to generate syslog entries for traffic matches." },
  { question:"Which CLI command shows syslog on NSX Manager?", choices:["get log-file auch.log","get log-file syslog","show log manager follow","/var/log/syslog/syslog.log"], correct:[1], explanation:"The correct command to view the syslog on NSX Manager is 'get log-file syslog'. This command displays the system log output directly from the NSX CLI, making it useful for operational troubleshooting." },
  { question:"Which of the two following characteristics about NAT64 are true?", choices:["NAT64 is supported on Tier-1 gateways only.","NAT64 requires the Tier-1 gateway to be configured in active-standby mode.","NAT64 is stateless and requires gateways to be deployed in active-standby mode.","NAT64 requires the Tier-1 gateway to be configured in active-active mode.","NAT64 is supported on Tier-0 and Tier-1 gateways."], correct:[1,4], explanation:"NAT64 is supported on both Tier-0 and Tier-1 gateways. For stateful NAT64 functionality, the Tier-1 gateway must be configured in active-standby mode." },
  { question:"Which VMware NSX Portfolio product can be described as a distributed analysis solution that provides visibility and dynamic security policy enforcement for NSX environments?", choices:["NSX Distributed IDS/IPS","NSX Manager","NSX Intelligence","NSX Cloud"], correct:[2], explanation:"NSX Intelligence is a distributed analytics engine that provides deep visibility into NSX environments and enables dynamic security policy enforcement based on real-time traffic flows and application behavior." },
  { question:"NSX improves the security of today's modern workloads by preventing lateral movement, which feature of NSX can be used to achieve this?", choices:["Virtual Security Zones","Edge Firewalling","Dynamic Routing","Network Segmentation"], correct:[3], explanation:"Network Segmentation in NSX, particularly through micro-segmentation using the Distributed Firewall, prevents lateral movement of threats within the data center by enforcing fine-grained security controls between workloads." },

  
];

// Shuffle questions array at startup
shuffleArray(questions);
let idx = 0, score = 0;
const quizContent = document.getElementById('quizContent');
const actionBtn = document.getElementById('actionBtn');
const progressBar = document.getElementById('progressBar');

function renderQuestion() {
  const q = questions[idx];
  // Prepare a shuffled array of choices with their original index preserved.
  const choicesArray = q.choices.map((choice, i) => ({ choice, index: i }));
  shuffleArray(choicesArray);
  quizContent.innerHTML = `<div class="question">${q.question}</div><ul class="options">` + 
    choicesArray.map(item => `<li><label><input type="${Array.isArray(q.correct) ? 'checkbox' : 'radio'}" name="opt" value="${item.index}">${item.choice}</label></li>`).join('') + 
    '</ul>';
  actionBtn.textContent = 'Submit';
}

function showResult(correct) {
  quizContent.innerHTML = `<h2 class="${correct?'correct':'incorrect'}">${correct?'Correct!':'Incorrect!'}</h2><p>${questions[idx].explanation}</p>`;
  actionBtn.textContent = idx < questions.length - 1 ? 'Next' : 'Finish';
  updateProgress();
}

function finishQuiz() {
  const finalScore = Math.round((score / questions.length) * 500);
  quizContent.innerHTML = `<h2>Your Score: ${finalScore} / 500</h2><p>${finalScore >= 300 ? '🎉 You passed!' : '❌ You did not pass.'}</p>`;
  actionBtn.disabled = true;
  updateProgress();
}

function updateProgress() { 
  progressBar.style.width = ((idx+1)/questions.length*100)+'%'; 
}

actionBtn.onclick = () => {
  const state = actionBtn.textContent;
  if (state === 'Start Quiz' || state === 'Next') {
    renderQuestion();
    return;
  }
  if (state === 'Finish') {
    finishQuiz();
    return;
  }
  const selected = Array.from(document.querySelectorAll('input[name="opt"]:checked')).map(i => +i.value);
  if (!selected.length) { 
    alert('Select an answer'); 
    return; 
  }
  const correct = JSON.stringify(selected.sort()) === JSON.stringify((Array.isArray(questions[idx].correct) ? questions[idx].correct : [questions[idx].correct]).sort());
  if (correct) score++;
  showResult(correct);
  idx++;
};
</script>
